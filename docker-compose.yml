services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: auth-service:latest
    container_name: auth-service
    ports:
      - "4005:4005"
    environment:
      JWT_SECRET: ${JWT_SECRET:-VGhpcyBpcyBhIGRldiBzZWNyZXQga2V5IGZvciBsb2NhbCB1c2U=}
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USERNAME:-admin_user}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      auth-service-db:
        condition: service_healthy

  auth-service-db:
    image: postgres:latest
    container_name: auth-service-db
    ports:
      - "5001:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USERNAME:-admin_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-password}
    volumes:
      - auth-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "4004:4004"
    environment:
      AUTH_SERVICE_URL: http://auth-service:4005
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4004/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  patient-service-db:
    image: postgres:latest
    container_name: patient-service-db
    ports:
      - "5000:5432"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: ${PATIENT_DB_USERNAME:-admin_user}
      POSTGRES_PASSWORD: ${PATIENT_DB_PASSWORD:-password}

  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    image: patient-service
    container_name: patient-service_latest
    ports:
      - "4000:4000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: ${PATIENT_DB_USERNAME:-admin_user}
      SPRING_DATASOURCE_PASSWORD: ${PATIENT_DB_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - patient-service-db
      - billing-service

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    image: billing-service:latest
    container_name: billing-service
    ports:
      - "4001:4001"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    image: analytics-service:latest
    container_name: analytics-service
    ports:
      - "4002:4002"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4002/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  adminer:
    image: adminer:latest
    container_name: patient-service-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: auth-service-db
    depends_on:
      auth-service-db:
        condition: service_healthy
      patient-service-db:
        condition: service_started

volumes:
  auth-service-db-data:

networks:
  default: {}