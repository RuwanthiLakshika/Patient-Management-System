name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  maven:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - patient-service
          - billing-service
          - analytics-service
          - api-gateway
          - infrastructure
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress test

  containers:
    name: Build container images
    runs-on: ubuntu-latest
    needs: maven
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            image: auth-service
          - service: patient-service
            image: patient-service
          - service: billing-service
            image: billing-service
          - service: analytics-service
            image: analytics-service
          - service: api-gateway
            image: api-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }}
        run: docker build --tag ${{ matrix.image }}:${{ github.sha }} ./${{ matrix.service }}
