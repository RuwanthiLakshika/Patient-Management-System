<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Patient Management System - Target AWS Deployment Architecture</title>
  <desc id="desc">AWS target architecture showing an internet-facing Application Load Balancer, private ECS Fargate services, private RDS databases, private MSK Kafka, ECR, IAM, CloudWatch, and Secrets Manager.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .box { stroke: #334155; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .service { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .data { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; rx: 8; }
      .support { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 8; }
      .boundary { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 18; }
      .subnet-public { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 14; }
      .subnet-private { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 14; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="60" y="58" class="title">Patient Management System - Target AWS Deployment Architecture</text>
  <text x="60" y="88" class="subtitle">AWS CDK / CloudFormation target design | ECS Fargate microservices | PostgreSQL | Kafka | gRPC | REST</text>

  <rect x="54" y="120" width="1492" height="700" class="boundary"/>
  <text x="78" y="153" class="label">AWS Region: us-east-1 (example)</text>
  <text x="78" y="177" class="small">VPC with public and private subnets across two Availability Zones</text>

  <rect x="82" y="214" width="270" height="210" class="subnet-public"/>
  <text x="106" y="246" class="label">Public subnets</text>
  <text x="106" y="269" class="small">Internet-facing entry point</text>
  <rect x="115" y="305" width="204" height="72" class="support"/>
  <text x="217" y="335" text-anchor="middle" class="label">Application Load Balancer</text>
  <text x="217" y="358" text-anchor="middle" class="small">HTTPS / HTTP listener</text>

  <rect x="390" y="214" width="680" height="548" class="subnet-private"/>
  <text x="416" y="246" class="label">Private subnets - ECS cluster</text>
  <text x="416" y="269" class="small">ECS Fargate tasks have no public IP addresses</text>

  <rect x="424" y="303" width="190" height="82" class="service"/>
  <text x="519" y="335" text-anchor="middle" class="label">API Gateway</text>
  <text x="519" y="358" text-anchor="middle" class="small">ECS Fargate service</text>
  <rect x="650" y="303" width="190" height="82" class="service"/>
  <text x="745" y="335" text-anchor="middle" class="label">Auth Service</text>
  <text x="745" y="358" text-anchor="middle" class="small">JWT / REST</text>
  <rect x="876" y="303" width="160" height="82" class="service"/>
  <text x="956" y="335" text-anchor="middle" class="label">Billing</text>
  <text x="956" y="358" text-anchor="middle" class="small">gRPC server</text>

  <rect x="424" y="452" width="190" height="82" class="service"/>
  <text x="519" y="484" text-anchor="middle" class="label">Patient Service</text>
  <text x="519" y="507" text-anchor="middle" class="small">REST / gRPC client</text>
  <rect x="650" y="452" width="190" height="82" class="service"/>
  <text x="745" y="484" text-anchor="middle" class="label">Analytics Service</text>
  <text x="745" y="507" text-anchor="middle" class="small">Kafka consumer</text>
  <rect x="876" y="452" width="160" height="82" class="service"/>
  <text x="956" y="484" text-anchor="middle" class="label">ECS Cluster</text>
  <text x="956" y="507" text-anchor="middle" class="small">service orchestration</text>

  <rect x="424" y="600" width="612" height="112" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" rx="12"/>
  <text x="730" y="632" text-anchor="middle" class="label">Private service communication</text>
  <text x="730" y="658" text-anchor="middle" class="small">Cloud Map / ECS service discovery for AWS</text>
  <text x="730" y="681" text-anchor="middle" class="small">Patient Service -> Billing Service over gRPC</text>

  <rect x="1110" y="214" width="390" height="240" class="subnet-private"/>
  <text x="1136" y="246" class="label">Private subnets - RDS</text>
  <text x="1136" y="269" class="small">Managed PostgreSQL databases</text>
  <rect x="1145" y="310" width="145" height="86" class="data"/>
  <text x="1217" y="344" text-anchor="middle" class="label">Auth DB</text>
  <text x="1217" y="367" text-anchor="middle" class="small">Amazon RDS</text>
  <rect x="1320" y="310" width="145" height="86" class="data"/>
  <text x="1392" y="344" text-anchor="middle" class="label">Patient DB</text>
  <text x="1392" y="367" text-anchor="middle" class="small">Amazon RDS</text>

  <rect x="1110" y="490" width="390" height="272" class="subnet-private"/>
  <text x="1136" y="522" class="label">Private subnets - MSK</text>
  <text x="1136" y="545" class="small">Managed Kafka event streaming</text>
  <rect x="1150" y="590" width="310" height="92" class="data"/>
  <text x="1305" y="627" text-anchor="middle" class="label">Amazon MSK cluster</text>
  <text x="1305" y="651" text-anchor="middle" class="small">patient topic / event consumers</text>

  <rect x="82" y="850" width="340" height="78" class="support"/>
  <text x="252" y="880" text-anchor="middle" class="label">Amazon ECR</text>
  <text x="252" y="903" text-anchor="middle" class="small">Docker images for all services</text>
  <rect x="470" y="850" width="340" height="78" class="support"/>
  <text x="640" y="880" text-anchor="middle" class="label">IAM</text>
  <text x="640" y="903" text-anchor="middle" class="small">Task and execution permissions</text>
  <rect x="858" y="850" width="310" height="78" class="support"/>
  <text x="1013" y="880" text-anchor="middle" class="label">CloudWatch</text>
  <text x="1013" y="903" text-anchor="middle" class="small">Logs, metrics, alarms</text>
  <rect x="1216" y="850" width="284" height="78" class="support"/>
  <text x="1358" y="880" text-anchor="middle" class="label">Secrets Manager</text>
  <text x="1358" y="903" text-anchor="middle" class="small">DB and JWT secrets</text>

  <path d="M20 344 H115" class="line"/>
  <text x="20" y="329" class="small">Internet</text>
  <path d="M319 341 H424" class="line"/>
  <path d="M519 385 V452" class="dashed"/>
  <path d="M745 385 V452" class="dashed"/>
  <path d="M614 493 H650" class="line"/>
  <path d="M840 493 H1150" class="dashed"/>
  <path d="M840 344 H1145" class="dashed"/>
  <path d="M745 534 V590 H1150" class="dashed"/>

  <rect x="54" y="945" width="1492" height="24" fill="#f1f5f9" rx="6"/>
  <text x="800" y="962" text-anchor="middle" class="small">Target AWS architecture. Local development uses Docker Compose; LocalStack Hobby validates supported AWS APIs but does not run the complete AWS runtime.</text>
</svg>
